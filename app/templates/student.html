<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Trực Tuyến - {{ room_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .laser-dot {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 15px 4px #ef4444, 0 0 25px 8px #f87171;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 50;
            transition: all 0.04s ease-out;
        }
        .canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Student Floating Pill Bar -->
    <header class="h-12 bg-slate-900/80 backdrop-blur border-b border-slate-800/80 px-4 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center space-x-3">
            <span class="flex h-2.5 w-2.5 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
            </span>
            <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-slate-100 truncate max-w-xs sm:max-w-md" id="room-title-text">{{ room_title }}</span>
                <span class="text-[10px] px-2 py-0.5 bg-blue-900/60 text-blue-300 font-semibold rounded-full border border-blue-700/50">Trực tiếp</span>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <span id="sync-status" class="text-[11px] text-emerald-400 font-semibold flex items-center space-x-1">
                <i class="fa-solid fa-cloud-arrow-down"></i>
                <span class="hidden sm:inline">Đã đồng bộ</span>
            </span>
            <button onclick="toggleFullScreen()" class="p-1.5 text-slate-400 hover:text-white rounded-lg transition" title="Toàn màn hình">
                <i class="fa-solid fa-expand text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Main Presentation Viewing Stage -->
    <main class="flex-1 relative flex items-center justify-center p-2 bg-slate-950 overflow-hidden">
        
        <!-- Scrollable Stage Container -->
        <div id="stage-scroll-container" class="relative w-full h-full max-h-[calc(100vh-100px)] overflow-y-auto overflow-x-hidden flex justify-center items-start my-auto">
            
            <div id="stage-wrapper" class="relative w-full max-w-4xl bg-white text-slate-900 rounded-2xl shadow-2xl overflow-hidden flex flex-col items-center justify-center border border-slate-800 transition-all duration-150 my-auto">
                
                <!-- 1. SLIDE DISPLAY CONTAINER -->
                <div id="slide-container" class="w-full relative flex flex-col items-center justify-center">
                    <!-- If Image mode (PDF page) -->
                    <img id="slide-img" src="" alt="Slide Page" class="w-full h-auto object-contain hidden pointer-events-none transition-all block">

                    <!-- If Card mode (PPTX/DOCX cards) -->
                    <div id="slide-card" class="w-full p-6 sm:p-10 flex flex-col justify-between hidden min-h-[450px]">
                        <div>
                            <div class="border-b-2 border-blue-600 pb-3 mb-6">
                                <span class="text-xs font-bold uppercase tracking-wider text-blue-600 mb-1 block">NỘI DUNG BÀI HỌC</span>
                                <h2 id="card-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900">Tiêu đề bài giảng</h2>
                            </div>
                            <ul id="card-bullets" class="space-y-4 text-slate-700 text-base sm:text-xl font-medium list-none">
                                <!-- Bullets dynamically injected -->
                            </ul>
                        </div>
                        <div class="pt-4 border-t border-slate-200 flex justify-between items-center text-xs text-slate-400 mt-6">
                            <span>SmartClassroom • Lớp học số</span>
                            <span id="card-page-indicator">Trang 1</span>
                        </div>
                    </div>

                    <!-- If Waiting for Teacher -->
                    <div id="waiting-notice" class="text-center p-8 text-slate-400">
                        <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-3"></i>
                        <h3 class="text-lg font-bold text-slate-700 mb-1">Đang kết nối bài giảng...</h3>
                        <p class="text-xs text-slate-400">Thầy/Cô đang chuẩn bị trình chiếu. Hãy giữ màn hình này.</p>
                    </div>
                </div>

                <!-- 2. SCREEN SHARE LIVE VIDEO (WebRTC) -->
                <video id="screen-video" autoplay playsinline class="w-full h-full object-contain bg-black hidden z-10"></video>

                <!-- 3. DRAWING OVERLAY CANVAS -->
                <canvas id="paint-canvas" class="canvas-overlay"></canvas>

                <!-- 4. LASER POINTER DOT -->
                <div id="laser-dot" class="laser-dot hidden"></div>
            </div>

        </div>

    </main>

    <!-- Bottom Indicator Bar -->
    <footer class="h-10 bg-slate-900/90 border-t border-slate-800/80 px-4 flex items-center justify-between text-xs text-slate-400 shrink-0">
        <div>
            Trang hiện tại: <span id="current-page-text" class="font-bold text-white">1</span> / <span id="total-page-text" class="font-bold text-white">1</span>
        </div>
        <div class="flex items-center space-x-2 text-[11px]">
            <i class="fa-solid fa-shield-halved text-emerald-400"></i>
            <span>Đồng bộ tự động theo thao tác của Thầy/Cô</span>
        </div>
    </footer>

    <script>
        window.INITIAL_SESSION = {{ session | tojson }};
        window.ROOM_ID = "{{ room_id }}";
        window.LAN_IP = "{{ lan_ip }}";
        var INITIAL_SESSION = window.INITIAL_SESSION;
        var ROOM_ID = window.ROOM_ID;
        var LAN_IP = window.LAN_IP;
    </script>
    <script src="/static/js/student.js?v=4"></script>
</body>
</html>
